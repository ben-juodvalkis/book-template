<!--
  02-photo-spread.html — TEMPLATE: full-bleed photo background (2 pages).
  Copy this file as the starting point for any spread where a photo covers the
  whole page.

  FILL IN:
    - background-image url() → your photo, path relative to the PROJECT ROOT
      (e.g. assets/my-photo.jpg). Paths with ../ will NOT resolve.
    - background-color → a hex close to the photo's edge color, so the bleed
      gutter is invisible if the photo doesn't quite cover it.
    - content inside the .safe wrapper, on top of the photo.

  NO PRE-EXPANDED BLEED IMAGE NEEDED: the .page div extends into the bleed via
  print.css (margin:-0.125in), so background-image:cover reaches the bleed
  automatically. Use the original photo file directly.

  IMAGE RESOLUTION: aim for ≥300 DPI at the printed size. For a full 8×10 bleed
  page that's ~2476×3076px.
-->

<style>
  @page p1 { background-color: #1a1a1a; }
  @page p2 { background-color: #1a1a1a; }
</style>

<!-- ── First page of this spread ──
     Hand depends on where the section falls in book.spreads (odd position from a
     recto start = RIGHT-hand; even = LEFT-hand). Pick the matching safe wrapper:
     .safe-right for a RIGHT-hand page, .safe-left for a LEFT-hand page, or the
     symmetric .safe if unsure. Full-bleed photos are hand-agnostic; the build's
     parity check handles the bleed side automatically. -->
<div class="page" style="
  page: p1;
  background-color: #1a1a1a;
  background-image: url('assets/placeholder.svg');
  background-size: cover;
  background-position: center center;
">
  <div class="safe">
    <!-- caption / title text on top of the photo, if any -->
  </div>
  <span class="page-number left on-dark"></span>
</div>

<!-- ── Second page — photo-card collage on a color field ──
     Demonstrates the .photo-card classes from design.css. See
     docs/DESIGN-LANGUAGE.md for the full recipe set. -->
<div class="page" style="page: p2; background-color: var(--accent-2);">

  <!-- Jagged colored-border card (the classic), with a caption strip -->
  <div class="photo-card jagged" style="
    top:0.7in; left:0.7in; width:3.2in; height:4.2in;
    background:var(--accent-1); transform:rotate(-3deg); z-index:4;">
    <div class="photo-card-inner" style="bottom:0.6in;">
      <img src="assets/placeholder.svg" alt="">
    </div>
    <div class="caption">a jagged photo card</div>
  </div>

  <!-- Film-still card (tight black border, no jagged edge) -->
  <div class="photo-card film" style="
    top:5.2in; right:0.7in; width:3.2in; height:3.2in;
    transform:rotate(2deg); z-index:5;">
    <div class="photo-card-inner"><img src="assets/placeholder.svg" alt=""></div>
  </div>

  <span class="page-number right on-dark"></span>
</div>
